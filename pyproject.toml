[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aioprecioscarburantes"
version = "0.5.0"
description = "Async client for Spanish fuel prices from the Ministry's PreciosCarburantes service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "jjprz" }]
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jjprz/aioprecioscarburantes"

[project.optional-dependencies]
test = ["pytest-aiohttp", "pytest", "pytest-asyncio", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "TRY003", "EM101", "EM102", "D203", "D213", "COM812", "S101", "PLR2004", "ANN401"]
